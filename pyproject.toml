[project]
name = "gbsabench"
version = "0.2.0"
description = "MM-GBSA affinity-ranking reproducibility study on newbench-15/discovery-9: analysis helpers, data, and notebooks."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "statsmodels>=0.14,<1",
    "pandas>=2.0,<3",
    "polars>=1.42.1",
    "pyarrow>=10",
    "matplotlib>=3.7,<4",
    "seaborn>=0.13.2",
    "scikit-learn>=1.3,<2",
    "jupyter>=1.0",
    "jupyterlab>=1.0",
    "ipykernel>=6.0",
    "nbconvert>=7.0",
    "nbstripout>=0.9.1",
]

[project.optional-dependencies]
# Everything to recompute per-complex features from the trajectories (heavy: MDA, RDKit).
reproduce = [
    "MDAnalysis>=2.7",
    "freesasa>=2.2",
    "rdkit>=2023",
    "tqdm>=4.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Two packages are shipped for the moment: `gbsabench` is the target public API; `discovery9`
# is the historical package name still imported by 21 of the 34 notebooks — kept until every
# notebook is migrated to gbsabench (tracked as a follow-up task).
packages = ["src/gbsabench", "src/discovery9"]
